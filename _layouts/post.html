---
layout: default
---

<main>
    <header class="post-header">
        <div class="post-meta">
            <span class="category">{{ page.categories | first | default: "Post" }}</span>
            <span class="date">{{ page.date | date: "%Y. %m. %d" }}</span>
        </div>
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="tags">
            {% for tag in page.tags %}
            <span class="tag">#{{ tag }}</span>
            {% endfor %}
        </div>
    </header>

    <article class="post-content">
        {{ content }}
    </article>
</main>

<script>
    window.addEventListener('scroll', () => {
        const logo = document.querySelector('.logo');
        if (!logo) return;
        
        const siteTitle = "{{ site.title }}";
        const postTitle = "{{ page.title | escape }}";
        
        // When scrolled past the post-header, change the logo text to the post title
        if (window.scrollY > 150) {
            logo.textContent = postTitle;
            logo.style.fontSize = "1.05rem"; // slightly smaller to fit long titles
            logo.style.maxWidth = "70vw";
            logo.style.whiteSpace = "nowrap";
            logo.style.overflow = "hidden";
            logo.style.textOverflow = "ellipsis";
        } else {
            logo.textContent = siteTitle;
            logo.style.fontSize = ""; // reset to original
            logo.style.maxWidth = "";
        }
    });
</script>
