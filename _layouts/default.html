<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "ko" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
        // 깜빡임 방지를 위해 head에서 테마 설정
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.dataset.theme = savedTheme;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    
    <!-- MathJax for LaTeX Support -->
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      },
      startup: {
        pageReady: () => {
          const article = document.querySelector(
            '.tt_article_useless_p_margin, .article_view, .entry-content, .post-content'
          );

          if (article) {
            /**
             * 수식 내부 HTML을 깨끗한 LaTeX 문자열로 복원합니다.
             * 티스토리 에디터가 망가뜨리는 패턴을 순서대로 처리합니다.
             */
            function cleanMath(raw) {
              return raw
                // ① <sub>x</sub> → _x  /  <sup>x</sup> → ^x  (에디터 자동 변환 복원)
                .replace(/<sub>([\s\S]*?)<\/sub>/gi, '_$1')
                .replace(/<sup>([\s\S]*?)<\/sup>/gi, '^$1')
                // ② 줄바꿈 역할의 태그 → \n
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/?p[^>]*>/gi, '\n')
                // ③ 나머지 HTML 태그 전부 제거
                .replace(/<[^>]+>/g, '')
                // ④ HTML 엔티티 디코딩
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/&#39;/g, "'")
                // ⑤ 대괄호 복원 (핵심!)
                .replace(/&#91;/g, '[')
                .replace(/&#93;/g, ']')
                .replace(/&lbrack;/g, '[')
                .replace(/&rbrack;/g, ']')
                // ⑥ 기타 자주 깨지는 기호
                .replace(/&nbsp;/g, ' ')
                .replace(/&Hat;/g, '^')
                .replace(/&lowbar;/g, '_')
                .replace(/&hellip;/g, '...')
                .trim();
            }

            let html = article.innerHTML;

            // ── Display math: $$ ... $$ ──────────────────────────────
            html = html.replace(/\$\$([\s\S]*?)\$\$/g, (_, content) => {
              const latex = cleanMath(content);
              return (
                '<div style="overflow-x:auto;text-align:center;margin:1.2em 0;">$$' +
                latex +
                '$$</div>'
              );
            });

            // ── Inline math: $ ... $  ($$ 제외, 줄바꿈 불허) ─────────
            html = html.replace(/(?<!\$)\$([^$\n]{1,400}?)\$(?!\$)/g, (_, content) => {
              const latex = cleanMath(content);
              return '$' + latex + '$';
            });

            article.innerHTML = html;
          }

          return MathJax.startup.defaultPageReady();
        }
      }
    };
  </script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
            <nav>
                <ul>
                    <li>
                        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Dark Mode">
                            <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                            <svg id="sun-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="page-layout container">
        <aside class="sidebar">
            <div class="sidebar-inner">
                <h3>Categories</h3>
                <ul class="category-list">
                    {% for category in site.categories %}
                    <li>
                        <a href="{{ '/' | relative_url }}?category={{ category[0] | url_encode }}">
                            <span class="cat-name">{{ category[0] }}</span>
                            <span class="cat-count">{{ category[1].size }}</span>
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </aside>
        
        <div class="main-content">
            {{ content }}
        </div>
    </div>
    <footer>
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
    </footer>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const moonIcon = document.getElementById('moon-icon');
        const sunIcon = document.getElementById('sun-icon');
        
        function updateIcon() {
            if (document.documentElement.dataset.theme === 'dark') {
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else {
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            }
        }
        
        updateIcon();

        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.dataset.theme;
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);
            updateIcon();
        });
    </script>
</body>
</html>
